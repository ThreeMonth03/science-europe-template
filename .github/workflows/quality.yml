name: Template quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [unit, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install declared English dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare public Knowledge Model fixtures independently
        run: make knowledge-models
      - name: Check template validity
        run: make verify
      - name: Check current English answers and PO-aware unit contracts
        if: matrix.group == 'unit'
        shell: bash
        run: |
          mkdir -p outputs
          python scripts/check_current.py --output outputs/current-behavior.json
          PYTHONPATH=tests:scripts python -m unittest -v \
            tests.test_current_behavior.CurrentI18nTests \
            tests.test_current_behavior.CurrentBudgetLayoutTests \
            tests.test_q3_storage_groups \
            tests.test_derived_submission_headings.DerivedSubmissionHeadingsTests \
            tests.test_document_metadata.DocumentMetadataTests \
            tests.test_answer_states.AnswerStateTests \
            tests.test_science_europe_contract.ScienceEuropeContractTests \
            tests.test_upstream_audit.UpstreamAuditTests \
            2>&1 | tee outputs/current-unit.log
          python -m unittest discover -s experiments/legacy434 -v \
            2>&1 | tee outputs/current-compat434-unit.log
      - name: Check current parser and bounded native layout on stock workers
        if: matrix.group == 'native'
        shell: bash
        run: |
          mkdir -p outputs
          docker pull datastewardshipwizard/document-worker@sha256:06707194979a80981b1308f618716bc3a6640c4ff1039d85e5971690d51606a2
          docker pull datastewardshipwizard/document-worker@sha256:726b2906b3eee3fa7301ffdd723901397518c61e112f054ff53fabe07538fad3
          PYTHONPATH=tests:scripts python -m unittest -v \
            tests.test_answer_markdown.AnswerMarkdownTests \
            tests.test_layout.LayoutTests \
            2>&1 | tee outputs/current-native-unit.log
      - name: Preserve scoped reports even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: english-current-${{ matrix.group }}-reports
          path: |
            outputs/*.json
            outputs/*.log
          retention-days: 14
      - name: State tested source and acceptance boundary
        if: always()
        shell: bash
        run: |
          echo "Current lane: ${{ matrix.group }}; source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks execute the current PO source. They do not establish universal PDF or Microsoft Word acceptance.' >> "$GITHUB_STEP_SUMMARY"

  # Preserve the required-check identity; a skipped/cancelled lane is not green.
  contract-and-template:
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check group to succeed
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
