name: Template quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contract-and-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make check
      - name: Check bounded Word pagination with pinned worker Pandoc
        run: python scripts/probe_budget_word.py --output outputs/budget-word-probe.json
      - name: Check long-budget Word structure with pinned worker Pandoc
        run: python scripts/probe_long_budget_word.py --output outputs/long-budget-word-probe.json
      - name: Check budget CSS with the pinned worker rendering engine
        run: python scripts/probe_budget_pdf.py --output outputs/budget-pdf-probe.json
